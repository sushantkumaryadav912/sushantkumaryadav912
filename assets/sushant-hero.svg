<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="heroTitle heroDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="heroTitle">Sushant Kumar Yadav</title>
  <desc id="heroDesc">Computer Science student focused on cybersecurity and full-stack development.</desc>
  <defs>
    <linearGradient id="shHeroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="shHeroGlow" cx="0.82" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shHeroLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <pattern id="shHeroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.10" stroke-width="0.6"/>
    </pattern>
    <filter id="shHeroBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#shHeroBg)"/>
  <rect width="1200" height="320" fill="url(#shHeroGrid)"/>
  <rect width="1200" height="320" fill="url(#shHeroGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- restrained orbital geometry -->
  <g transform="translate(980 160)" fill="none" stroke="#C77B9B" stroke-opacity="0.45">
    <circle r="92" stroke-width="0.8"/>
    <circle r="58" stroke-width="0.8" stroke-dasharray="3 7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle cx="92" cy="0" r="4" fill="#E5B5C7" stroke="none"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <circle cx="58" cy="0" r="3" fill="#C77B9B" stroke="none"/>
    </g>
  </g>

  <!-- drawn path (visible statically, pulses when motion is supported) -->
  <path d="M0 262 C180 262 220 226 360 226 S560 270 700 240 S880 196 1200 214"
        fill="none" stroke="#C77B9B" stroke-width="1.6" stroke-opacity="0.8"
        stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 262 C180 262 220 226 360 226 S560 270 700 240 S880 196 1200 214"
        fill="none" stroke="#E5B5C7" stroke-width="1" stroke-opacity="0.3" filter="url(#shHeroBlur)"/>

  <!-- text -->
  <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#F8F0F3">Sushant Kumar Yadav</text>
  <text x="72" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E5B5C7" letter-spacing="1">Computer Science Student · Cybersecurity · Full-Stack Development</text>

  <!-- glowing underline -->
  <rect x="72" y="214" width="420" height="3" rx="1.5" fill="url(#shHeroLine)">
    <animate attributeName="width" values="260;420;260" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="72" y="212" width="420" height="7" rx="3.5" fill="url(#shHeroLine)" opacity="0.35" filter="url(#shHeroBlur)"/>
</svg>
